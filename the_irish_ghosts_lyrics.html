<html lang="en">
<head>

<title>The Irish Ghosts — Lyric Book</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0b; --card:#16161a; --border:#2a2a35;
  --green:#4a9e6b; --gold:#c9a84c; --gold-light:#e8c97a;
  --text:#e8e0d0; --muted:#8a8070; --white:#f5f0e8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'IM Fell English',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(74,158,107,.05) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(201,168,76,.05) 0%,transparent 60%);pointer-events:none;z-index:0;}

header{position:relative;z-index:1;text-align:center;padding:52px 20px 34px;border-bottom:1px solid var(--border);}
.shamrocks{display:flex;justify-content:center;gap:14px;margin-bottom:16px;}
.shamrock{font-size:1.3rem;color:var(--green);display:inline-block;animation:sway 3s ease-in-out infinite;}
.shamrock:nth-child(2){animation-delay:.3s}.shamrock:nth-child(3){animation-delay:.6s}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.band-name{font-family:'Cinzel Decorative',serif;font-size:clamp(1.8rem,6vw,3.4rem);font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{font-family:'Cinzel',serif;font-size:clamp(.65rem,2vw,.9rem);letter-spacing:.35em;color:var(--muted);text-transform:uppercase;margin-top:10px;}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 0;max-width:360px;}
.divider-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.divider-sym{color:var(--gold);font-size:1rem;}

.search-wrap{position:relative;z-index:1;max-width:560px;margin:30px auto 0;padding:0 20px;}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:13px 18px 13px 46px;color:var(--text);font-family:'IM Fell English',serif;font-size:1rem;outline:none;transition:border-color .3s,box-shadow .3s;}
.search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,158,107,.12);}
.search-input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:34px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.song-count{text-align:center;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;color:var(--muted);margin-top:10px;}

.main{position:relative;z-index:1;display:grid;grid-template-columns:260px 1fr;max-width:1060px;margin:34px auto 60px;padding:0 20px;min-height:500px;}

.sidebar{border-right:1px solid var(--border);padding-right:20px;}
.sidebar-title{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.song-list{list-style:none;display:flex;flex-direction:column;gap:2px;}
.song-item{cursor:pointer;padding:9px 12px;border-radius:3px;font-size:.87rem;color:var(--muted);transition:all .2s;border:1px solid transparent;display:flex;align-items:flex-start;gap:8px;}
.song-item:hover{background:var(--card);color:var(--text);border-color:var(--border);}
.song-item.active{background:var(--card);color:var(--gold-light);border-color:rgba(201,168,76,.3);}
.song-num{font-family:'Cinzel',serif;font-size:.62rem;color:var(--border);min-width:18px;padding-top:2px;transition:color .2s;}
.song-item.active .song-num{color:var(--gold);}

.lyrics-panel{padding-left:36px;}
.lyrics-header{margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.lyrics-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,3vw,1.85rem);font-weight:400;color:var(--gold-light);line-height:1.2;margin-bottom:6px;}
.lyrics-meta{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;}
.verse{margin-bottom:22px;line-height:1.95;}
.chorus{margin:22px 0;padding:16px 20px;border-left:2px solid var(--green);background:rgba(74,158,107,.05);border-radius:0 4px 4px 0;font-style:italic;line-height:1.95;color:var(--white);}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:400px;gap:14px;}
.welcome-icon{font-size:2.8rem;opacity:.2;}
.welcome-text{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}

footer{position:relative;z-index:1;text-align:center;padding:20px;border-top:1px solid var(--border);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}

@media(max-width:680px){
  .main{grid-template-columns:1fr;gap:24px;}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);padding-right:0;padding-bottom:20px;}
  .song-list{display:grid;grid-template-columns:1fr 1fr;}
  .lyrics-panel{padding-left:0;}
}
</style>
</head>

  { title: "Whiskey in the Jar", lyrics: `<div class="verse">As I was a goin' over the far famed Kerry mountainsI met with captain Farrell and his money he was countingI first produced my pistol and I then produced my rapierSaying "Stand and deliver" for he were a bold deceiver</div>

let currentIndex = -1;

function renderList(filtered) {
  const list = document.getElementById('songList');
  const count = document.getElementById('songCount');
  list.innerHTML = '';
  count.textContent = filtered.length + (filtered.length === 1 ? ' canción' : ' canciones');
  if (!filtered.length) {
    list.innerHTML = '<li style="font-family:Cinzel,serif;font-size:.7rem;letter-spacing:.2em;color:var(--muted);padding:20px 0;text-transform:uppercase;text-align:center;">Sin resultados</li>';
    return;
  }
  filtered.forEach(song => {
    const idx = songs.indexOf(song);
    const li = document.createElement('li');
    li.className = 'song-item' + (idx === currentIndex ? ' active' : '');
    li.innerHTML = `<span class="song-num">${String(idx+1).padStart(2,'0')}</span><span>${song.title}</span>`;
    li.onclick = () => showSong(idx);
    list.appendChild(li);
  });
}

function showSong(idx) {
  currentIndex = idx;
  const song = songs[idx];
  const panel = document.getElementById('lyricsPanel');
  panel.style.transition = 'opacity .25s';
  panel.style.opacity = '0';
  setTimeout(() => {
    panel.innerHTML = `<div class="lyrics-header"><div class="lyrics-title">${song.title}</div><div class="lyrics-meta">The Irish Ghosts &nbsp;·&nbsp; La Misa Ghost</div></div><div class="lyrics-body">${song.lyrics}</div>`;
    panel.style.opacity = '1';
    if (window.innerWidth <= 680) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 200);
  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.song-item').forEach(el => {
    if (songs[idx] && el.querySelector('span:last-child') && el.querySelector('span:last-child').textContent === song.title) el.classList.add('active');
  });
}

function filterSongs() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderList(q ? songs.filter(s => s.title.toLowerCase().includes(q)) : songs);
}

renderList(songs);
